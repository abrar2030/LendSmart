# Custom MongoDB configuration for LendSmart
storage:
  dbPath: /data/db

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

# Authentication is enabled through the MONGO_INITDB_ROOT_* environment
# variables provided to the container.
security:
  authorization: enabled
