apiVersion: v1
kind: Service
metadata:
  name: lendsmart-database
  namespace: default
  labels:
    app: lendsmart-database
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: database
