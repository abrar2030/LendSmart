apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  # Base64 encode your secrets before adding them here
  # Use: echo -n 'your-secret-value' | base64
  #
  # Example:
  # MONGODB_URI: bW9uZ29kYjovL3Jvb3Q6cGFzc0BsZW5kc21hcnQtZGF0YWJhc2U6MjcwMTcvbGVuZHNtYXJ0ZGI/YXV0aFNvdXJjZT1hZG1pbg==
  # API_KEY: eW91ci1hcGkta2V5LWhlcmU=
  #
  # IMPORTANT: Do NOT commit actual secrets to Git!
  # Use external secret management (Sealed Secrets, External Secrets Operator,
  # AWS Secrets Manager, HashiCorp Vault, etc.)

  MONGODB_URI: "" # mongodb://root:pass@lendsmart-database:27017/lendsmartdb?authSource=admin
  API_KEY: "" # your-api-key
  JWT_SECRET: "" # your-jwt-secret
  MONGO_ROOT_USERNAME: "" # mongo-root-username
  MONGO_ROOT_PASSWORD: "" # mongo-root-password
  MONGO_DATABASE: "" # database-name
